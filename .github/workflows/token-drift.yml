name: Token drift

# tokens/tokens.w3c.json is the source of truth. This fails the build whenever
# tokens.css, theme.css or a component drifts away from it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: tokens.w3c.json ↔ tokens.css ↔ theme.css
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # theme.css is generated from tokens.css — a stale copy is drift too.
      - name: Check theme.css is regenerated
        run: node scripts/build-theme.mjs --check

      # No dependencies to install — the checker is plain Node.
      - name: Check for token drift
        run: node scripts/check-token-drift.mjs

      # Each .astro <style> block is the source of truth; its docs demo page
      # must carry the same CSS. Also plain Node, no install.
      - name: Check component ↔ docs CSS parity
        run: node scripts/check-component-parity.mjs

      # The barrel, both exports maps and the package README are hand-kept — a
      # missing export otherwise only fails inside a consuming app, never here,
      # and a component missing from the README fails nowhere at all.
      - name: Check barrel, exports maps & README coverage
        run: node scripts/check-exports.mjs

      # The docs shell lives in one file now; a page re-declaring one of its
      # selectors is how the copies drifted apart before.
      - name: Check no page overrides the docs shell
        run: node scripts/check-docs-css.mjs

      # Badge paints text onto saturated fills in twelve combinations. Every
      # gate above stayed green while three of them failed WCAG AA, because
      # none of them looks at what a colour resolves to.
      - name: Check badge contrast meets WCAG AA
        run: node scripts/check-contrast.mjs

      # Two docs pages write out ~150 colour values by hand, and they are the
      # reference a consumer actually reads. Nothing looked at any of them until
      # 2026-08-11, when sixteen were wrong — including two rows documenting a
      # token that had not existed since the button group was restructured.
      # The self-test runs first: a parser that silently matches nothing reports
      # a clean page, which is the failure mode that let this drift.
      - name: Check the catalogue parsers can fail
        run: node scripts/check-catalogue.mjs --self-test

      - name: Check docs catalogue matches tokens.css
        run: node scripts/check-catalogue.mjs

      # The docs are static HTML with no build step, so the per-page description,
      # canonical, OG and JSON-LD are generated between markers. Hand-editing one
      # page is exactly the drift this catches.
      - name: Check docs SEO blocks are regenerated
        run: node scripts/build-seo.mjs --check

      # components.json is parsed from the interface Props blocks — it cannot
      # describe a prop that does not exist, but it can go stale.
      - name: Check component manifest is regenerated
        run: node scripts/build-manifest.mjs --check

      # Shipped in `npm run check` but never listed here, so it has only ever run
      # on someone's laptop. Zero-dep, so it belongs in this job.
      - name: Check docs code samples are regenerated
        run: node scripts/build-code-samples.mjs --check

      # The browser harnesses measure text, so they need the real font. They used
      # to fetch it from fonts.googleapis.com mid-run, which failed four times on
      # 2026-08-12 alone. This asserts the vendored copy is present and complete
      # WITHOUT going to the network — putting a CDN back in would defeat it.
      - name: Check vendored fonts are usable offline
        run: node scripts/vendor-fonts.mjs --check

  # Proves the theme actually compiles, and that every variable the components
  # read still resolves once Tailwind has processed it.
  compile:
    name: theme.css compiles under Tailwind v4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Tailwind
        run: npm i --no-save tailwindcss@4 @tailwindcss/cli@4

      - name: Compile
        run: npx @tailwindcss/cli -i tailwind/theme.css -o /tmp/out.css

      - name: Every component variable must resolve
        run: node scripts/check-component-vars.mjs /tmp/out.css

      # docs/utilities.css is generated and committed: the 32 docs pages are
      # static HTML with no build step, so nothing else compiles the utility
      # classes the components are moving to. Needs the CLI, which is why this
      # lives here and not in the dependency-free `check` job above.
      - name: Check compiled utilities are regenerated
        run: node scripts/build-utilities.mjs --check

  # The only job that needs a real install: it renders the components with Astro
  # and asserts the docs demo markup still matches. CSS parity above cannot see
  # a DOM change — this is the gate that can.
  #
  # It is also the only job that ends up with a BROWSER-READY tree, which is why
  # the overflow sweep is bolted on here rather than given a job of its own:
  # `npm ci` installs playwright-core (13MB, downloads no browser) and
  # build-demos.mjs builds playground/dist, which is the exact input the sweep
  # reads. A separate job would pay for both again.
  render:
    name: docs demo markup matches, and nothing overflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install workspaces
        run: npm ci

      # Also leaves playground/dist in place for the sweep below.
      - name: Check demo markup is regenerated
        run: node scripts/build-demos.mjs --check

      # Which Chrome the sweep actually gets. `channel: 'chrome'` resolves to the
      # runner's own install, not a Playwright download, so this is the version
      # every number below was measured on — record it before trusting them.
      - name: Chrome version under test
        run: google-chrome --version

      # A classifier that silently matches nothing reports a clean sweep. Its 16
      # known answers must pass before any reading from it is worth anything.
      - name: Check the overflow classifier can fail
        run: node scripts/check-overflow.mjs --self-test

      # 19 components × 9 widths. Each page arms itself first — a token must
      # resolve, Montserrat must load, and an injected unfittable element must be
      # SEEN and then stop being seen when removed. An unarmed page exits 1
      # rather than reporting a pass it did not earn.
      - name: Nothing leaves its box at any width
        run: node scripts/check-overflow.mjs
